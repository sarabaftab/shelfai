<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ShelfAI - Amazon Product Analyzer</title>
  </head>
  <body>
    <h2>🔍 Enter an Amazon Product URL</h2>
    <form action="/fetch" method="post">
      <input
        type="text"
        name="url"
        placeholder="https://www.amazon.com/dp/B08Y2N74CY"
        required
        style="width: 400px"
      />
      <button type="submit">Analyze</button>
    </form>
  </body>
</html>
